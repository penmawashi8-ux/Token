name: "[Step 2] コードをトークンに交換"

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "認証後のリダイレクト先URL（http://localhost/?code=... ごと貼り付けてOK）"
        required: true
        type: string
      client_id:
        description: "OAuth クライアント ID（空の場合は YOUTUBE_CLIENT_ID シークレットを使用）"
        required: false
        type: string
      client_secret:
        description: "OAuth クライアント シークレット（空の場合は YOUTUBE_CLIENT_SECRET シークレットを使用）"
        required: false
        type: string

jobs:
  exchange-code:
    name: リフレッシュトークンを取得
    runs-on: ubuntu-latest
    outputs:
      refresh_token: ${{ steps.get-token.outputs.refresh_token }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install requests

      - name: リフレッシュトークンを取得
        id: get-token
        env:
          YOUTUBE_CLIENT_ID: ${{ inputs.client_id || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ inputs.client_secret || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_AUTH_CODE: ${{ inputs.auth_code }}
        run: python get_token.py

      - name: 取得結果の案内
        if: success()
        run: |
          echo "========================================================"
          echo "  取得完了! 上のログの REFRESH_TOKEN= の値をコピーしてください。"
          echo ""
          echo "  GitHub Secrets に保存する場合:"
          echo "    Settings → Secrets and variables → Actions"
          echo "    → New repository secret"
          echo "    Name: YOUTUBE_REFRESH_TOKEN"
          echo "========================================================"
